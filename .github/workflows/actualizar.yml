name: Actualizar Spoilers Semanales

on:
  schedule:
    - cron: '0 3 * * 1' # Se ejecuta todos los lunes a las 3:00 AM
  workflow_dispatch: # Permite que tú puedas ejecutar el bot manualmente con un clic para probarlo

jobs:
  actualizar-listas:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar herramientas
        run: pip install -r requirements.txt

      - name: Ejecutar el Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Guardar la nueva lista en GitHub
        run: |
          git config --global user.name "CeroSpoilers Bot"
          git config --global user.email "bot@cerospoilers.com"
          git add tendencias.json
          git commit -m "Actualización automática de tendencias" || exit 0
          git push
